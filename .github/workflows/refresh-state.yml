name: Refresh leaderboard after input changes

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: leaderboard-state-refresh
  cancel-in-progress: false

jobs:
  refresh-if-stale:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout publication monitor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      # The deploy key is read-only and scoped to private production State.
      - name: Read current production State head
        # actions/checkout pinned to 3d3c42e5 (= refs/tags/v7.0.1 as of 2026-07-30).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: leanprover/lean-eval-state
          ref: main
          path: lean-eval-state
          ssh-key: ${{ secrets.PRODUCTION_STATE_READ_KEY }}
          persist-credentials: false
          fetch-depth: 1

      - name: Dispatch one refresh when published inputs are stale
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/refresh_leaderboard.sh
