name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # leanprover/lean-eval-submissions fires this after recording a new
  # result, so the site redeploys with it. Before the submission
  # pipeline split out, a record commit landed in this repo and the
  # `push` trigger covered it; results now live in a separate repo.
  repository_dispatch:
    types: [results-advanced]

permissions:
  contents: read
  pages: write
  id-token: write

# PR validation builds are disposable, so they get a per-PR group and
# supersede each other freely. Everything that can publish shares the single
# `github-pages` group and is never cancelled: a cancelled deploy is a lost
# publication, and GitHub does not retry it. Superseding only establishes that
# the newer build carries the same data, not that it succeeds, so cancelling a
# running deploy in favour of one that then fails leaves nothing published.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'github-pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout leaderboard repo
        # actions/checkout pinned to 3d3c42e5 (= refs/tags/v7.0.1 as of 2026-08-06).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Test snapshot generator
        run: python3 -m unittest discover -s tests

      - name: Checkout benchmark repo at the snapshot's pinned commit
        # site-data/leaderboard.json is regenerated each deploy from the
        # results store. The generator needs the benchmark repo for problem
        # metadata. We pin to the same commit benchmark-snapshot/ was built
        # from so the snapshot's catalog and the regenerated site-data stay
        # in lockstep.
        # actions/checkout pinned to 3d3c42e5 (= refs/tags/v7.0.1 as of 2026-08-06).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: leanprover/lean-eval
          path: lean-eval-benchmark
          fetch-depth: 0

      - name: Checkout the results store
        # leanprover/lean-eval-submissions holds results/<login>.json.
        # generate_site_data.py reads them via --results-repo. Always main
        # HEAD: the results store is append-only and the site shows latest.
        # actions/checkout pinned to 3d3c42e5 (= refs/tags/v7.0.1 as of 2026-08-06).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: leanprover/lean-eval-submissions
          path: lean-eval-submissions

      # Production-only. Pull requests exercise the explicit base-results
      # fallback and never receive the read-only private-State deploy key.
      - name: Checkout private production State for its redacted projection
        if: github.ref == 'refs/heads/main'
        # actions/checkout pinned to 3d3c42e5 (= refs/tags/v7.0.1 as of 2026-08-06).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: leanprover/lean-eval-state
          path: lean-eval-state
          ssh-key: ${{ secrets.PRODUCTION_STATE_READ_KEY }}
          persist-credentials: false

      - name: Pin benchmark checkout to snapshot commit
        run: |
          pin=$(cat benchmark-snapshot/.benchmark-commit)
          echo "Pinning benchmark to $pin"
          git -C lean-eval-benchmark checkout "$pin"

      - name: Set up elan
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 10 \
            --output "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Configure Pages
        # actions/configure-pages pinned to 45bfe019 (= refs/tags/v6.0.0 as of 2026-08-06).
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Cache site Lake workspace
        # actions/cache pinned to 55cc8345 (= refs/tags/v6.1.0 as of 2026-08-06).
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/packages
            .lake/build
          key: ${{ runner.os }}-site-lake-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lakefile.toml', 'lake-manifest.json') }}

      - name: Cache benchmark snapshot Lake workspace
        # actions/cache pinned to 55cc8345 (= refs/tags/v6.1.0 as of 2026-08-06).
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            benchmark-snapshot/.lake/packages
            benchmark-snapshot/.lake/build
          key: ${{ runner.os }}-snapshot-lake-${{ hashFiles('benchmark-snapshot/lean-toolchain', 'benchmark-snapshot/lakefile.toml', 'benchmark-snapshot/BenchmarkProblems.lean', 'benchmark-snapshot/BenchmarkProblems/**/*.lean') }}

      - name: Fetch Lake dependencies
        run: lake update

      - name: Prebuild benchmark snapshot
        # Each problem now lives in its own per-problem
        # `BenchmarkProblems/Problem<CamelId>.lean` so `import` lines
        # stay scoped to one problem at a time. We need a `:highlighted`
        # facet for every such module, so enumerate them from disk
        # rather than hard-coding a single Catalog target.
        shell: bash
        run: |
          set -euo pipefail
          cd benchmark-snapshot
          lake update
          # Fail fast if the snapshot producer and the site decoder resolved
          # different SubVerso revisions. Otherwise the highlighted JSON this
          # step emits fails to deserialize later in
          # LeaderboardSite.AnchorRegistry with a cryptic
          # "no inductive constructor matched". The snapshot's SubVerso pin is
          # derived from the site's Verso pin in scripts/generate_site_data.py;
          # this guard catches a Verso bump that landed without re-pinning the
          # snapshot. The site manifest is one level up.
          site_subverso=$(jq -r '.packages[] | select(.name == "subverso") | .rev' ../lake-manifest.json)
          snap_subverso=$(jq -r '.packages[] | select(.name == "subverso") | .rev' lake-manifest.json)
          if [ -z "$site_subverso" ] || [ -z "$snap_subverso" ]; then
            echo "::error::Could not read a resolved SubVerso revision from a Lake manifest."
            echo "  site (../lake-manifest.json):  ${site_subverso:-<none>}"
            echo "  snapshot (lake-manifest.json): ${snap_subverso:-<none>}"
            exit 1
          fi
          if [ "$site_subverso" != "$snap_subverso" ]; then
            echo "::error::SubVerso revision mismatch between the site decoder and the snapshot producer."
            echo "  site (LeaderboardSite, via Verso): ${site_subverso:-<none>}"
            echo "  snapshot (benchmark-snapshot):     ${snap_subverso:-<none>}"
            echo "Re-run the 'Advance benchmark-snapshot' workflow to re-pin and rebuild the snapshot."
            exit 1
          fi
          mapfile -t highlighted_targets < <(
            find BenchmarkProblems -maxdepth 1 -name 'Problem*.lean' -print \
              | sed 's|^BenchmarkProblems/||;s|\.lean$||' \
              | awk '{printf "+BenchmarkProblems.%s:highlighted\n", $1}'
          )
          lake build BenchmarkProblems subverso-extract-mod "${highlighted_targets[@]}"

      - name: Produce and validate the redacted public State projection
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          state_commit="$(git -C lean-eval-state rev-parse HEAD)"
          python3 lean-eval-state/scripts/public_projection.py \
            --root lean-eval-state \
            --state-commit "$state_commit" \
            --output "$RUNNER_TEMP/public-state.json"
          python3 lean-eval-state/scripts/public_projection.py \
            --validate "$RUNNER_TEMP/public-state.json"

      - name: Regenerate pull-request site-data from public base results
        if: github.ref != 'refs/heads/main'
        # site-data/ is .gitignored — regenerated here so every new result
        # in leanprover/lean-eval-submissions shows up on the next deploy.
        # --no-write-snapshot keeps benchmark-snapshot/ untouched so its
        # Lake cache stays warm.
        run: |
          python3 scripts/generate_site_data.py \
            --no-write-snapshot \
            --benchmark-repo lean-eval-benchmark \
            --results-repo lean-eval-submissions

      - name: Regenerate production site-data with the public State projection
        if: github.ref == 'refs/heads/main'
        run: |
          python3 scripts/generate_site_data.py \
            --no-write-snapshot \
            --benchmark-repo lean-eval-benchmark \
            --results-repo lean-eval-submissions \
            --state-projection "$RUNNER_TEMP/public-state.json" \
            --state-repo lean-eval-state

      - name: Build site
        run: lake exe lean-eval-leaderboard --output _site

      - name: Verify public catalog visibility
        run: |
          set -euo pipefail
          jq --exit-status \
            '.schema_version == 4 and all(.problems[]; .visible == true and .test == false)' \
            _site/site-data/problems.json
          public_count="$(jq '.problems | length' _site/site-data/problems.json)"
          jq --argjson count "$public_count" --exit-status \
            '.summary.problems == $count and .summary.main_problems == $count and .summary.test_problems == 0' \
            _site/site-data/leaderboard.json

      - name: Verify lifecycle-aware leaderboard cutover and preview artifacts
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/formalization-evaluation/index.html
          test -f _site/software-verification/index.html
          test -f _site/open-conjectures/index.html
          test -f _site/recent/index.html
          test -f _site/legacy/index.html
          test -f _site/legacy/problems/index.html
          test -f _site/preview/index.html
          test -f _site/preview/formalization-evaluation/index.html
          test -f _site/preview/software-verification/index.html
          test -f _site/preview/open-conjectures/index.html
          test -f _site/preview/recent/index.html
          test -f _site/site-data/leaderboard-preview.json
          test -f _site/site-data/v2/index.json
          test -f _site/site-data/v2/recent-solutions.json
          test -f _site/site-data/v2/recent-solutions.xml
          if [ "${{ github.ref }}" = 'refs/heads/main' ]; then
            test -f _site/site-data/public-state.json
            jq --exit-status \
              '.schema_version == 1 and .environment == "production" and (.source_state_commit | test("^[0-9a-f]{40}$"))' \
              _site/site-data/public-state.json
            if rg -n 'source_repository|source_commit|archive_|submission_id|nonce_digest' \
                _site/site-data/public-state.json; then
              echo "::error::Private State fields leaked into the public projection."
              exit 1
            fi
          fi
          while IFS= read -r problem_id; do
            test -n "$problem_id"
            test -f "_site/preview/problems/$problem_id/index.html"
            test -f "_site/problems/$problem_id/index.html"
            test -f "_site/legacy/problems/$problem_id/index.html"
            test -f "_site/site-data/v2/problems/$problem_id.json"
          done < <(jq -r '.problems[].id' _site/site-data/problems.json)
          grep -F "LeanEval leaderboard" _site/index.html
          grep -F 'data-v2-app="true"' _site/index.html
          test "$(grep -o '<h1' _site/index.html | wc -l)" -eq 1
          test "$(grep -o '<h1' _site/preview/index.html | wc -l)" -eq 1
          if grep -F 'v2-preview-badge' _site/index.html; then
            echo "::error::The stable leaderboard root still contains the preview badge."
            exit 1
          fi
          grep -F "LeanEval lifecycle-aware leaderboard" _site/preview/index.html
          grep -F 'aria-live="polite"' _site/preview/index.html
          jq --exit-status '.preview.kind == "results-v2-compatibility"' \
            _site/site-data/leaderboard-preview.json
          jq --exit-status \
            '.schema_version == 2 and .default_group == "formalization-evaluation" and (.groups | map(.id) | sort) == ["formalization-evaluation", "open-conjectures", "software-verification"] and all(.groups[]; (.url | startswith("preview/") | not))' \
            _site/site-data/v2/index.json
          jq --exit-status \
            '.problems as $problems | .schema_version == 2 and .standings_default_sort == "unique" and all(.credits[]; .problem_id as $id | any($problems[]; .id == $id)) and all(.problems[]; .url | startswith("problems/"))' \
            _site/site-data/v2/groups/formalization-evaluation.json
          grep -F '<rss version="2.0">' _site/site-data/v2/recent-solutions.xml
          python3 scripts/validate_site_data_v2.py --root _site/site-data/v2
          diff \
            <(jq --sort-keys 'del(.preview)' _site/site-data/leaderboard-preview.json) \
            <(jq --sort-keys '.' _site/site-data/leaderboard.json)

      - name: Check internal links resolve under the GitHub Pages base path
        # GitHub Pages serves this site under `/lean-eval-leaderboard/`, so a
        # link like `/foo` (root-absolute) or `../foo` (popping past the base
        # path) 404s in production even though it might resolve fine against a
        # flat `_site/` mount. `scripts/check_links.py` emulates the deployed
        # URL shape and fails on any href/src that escapes the base path or
        # points at a file that doesn't exist under `_site/`.
        run: |
          python3 scripts/check_links.py --site-dir _site --prefix lean-eval-leaderboard

      # Publish only from `main`. A positive ref check rather than "not a PR",
      # so a `workflow_dispatch` aimed at a feature branch cannot publish it.
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        # actions/upload-pages-artifact pinned to fc324d35 (= refs/tags/v5.0.0 as of 2026-08-06).
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # actions/deploy-pages pinned to cd2ce8fc (= refs/tags/v5.0.0 as of 2026-08-06).
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
