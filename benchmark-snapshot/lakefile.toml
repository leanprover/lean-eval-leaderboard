[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "c14c036584d8fb1a4a6e1c1d34fe8c4fcc2c06ac"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "31ce06eaadf4a200c0e1407c5f10953cf606b8f8"

[[require]]
name = "subverso"
git = "https://github.com/leanprover/subverso"
